name: C# bot and native GUI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build C# core, CLI and shared Blazor UI
        run: dotnet build ApiTrees.Portable.slnx -c Release -m:1
      - name: Regression checks
        run: dotnet run --project tests/ApiTrees.Tests -c Release --no-build
      - name: Fetch tested upstream game revision
        uses: actions/checkout@v4
        with:
          repository: I-Make-Stuff/API-Trees
          ref: 2acf9a0b3000a12e7e2e9b9f4ffa015b08a8c109
          path: upstream
      - name: Install upstream test dependencies
        run: python -m pip install -r upstream/api/requirements.txt
      - name: Exercise actual upstream endpoints
        run: python tests/run_integration.py upstream

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows
      - name: Publish unpackaged Windows GUI
        run: dotnet publish src/ApiTrees.Maui/ApiTrees.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -p:ApiTreesTargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:WindowsPackageType=None -m:1 -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: API-Trees-Bot-Windows-x64
          path: artifacts/windows/
          if-no-files-found: error
