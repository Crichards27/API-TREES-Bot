name: MAUI Blazor app and API checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build C# core, shared Blazor dashboard and test host
        run: dotnet build ApiTrees.Portable.slnx -c Release -m:1
      - name: Regression checks
        run: dotnet run --project tests/ApiTrees.Tests -c Release --no-build
      - name: Fetch tested upstream game revision
        uses: actions/checkout@v4
        with:
          repository: I-Make-Stuff/API-Trees
          ref: 2acf9a0b3000a12e7e2e9b9f4ffa015b08a8c109
          path: upstream
      - name: Install Python upstream server test dependencies
        run: python -m pip install -r upstream/api/requirements.txt
      - name: Exercise pinned upstream endpoints (test-only Python server)
        run: python tests/run_integration.py upstream

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows
      - name: Publish self-contained Windows EXE
        run: dotnet publish src/ApiTrees.Maui/ApiTrees.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -p:ApiTreesTargetFramework=net10.0-windows10.0.19041.0 -p:PublishProfile=WindowsSingleFile -m:1 -o artifacts/windows
      - name: Prepare release asset and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item -LiteralPath artifacts/windows/ApiTrees.Maui.exe -Destination artifacts/release/ApiTrees.Maui.exe
          $hash = (Get-FileHash -LiteralPath artifacts/release/ApiTrees.Maui.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ApiTrees.Maui.exe" | Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: API-Trees-Bot-Windows-x64
          path: artifacts/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable-and-api, windows-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: API-Trees-Bot-Windows-x64
          path: release-assets
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf 'Release already exists; leaving its verified assets unchanged.\n'
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/ApiTrees.Maui.exe release-assets/SHA256SUMS.txt \
              --verify-tag --title "API Trees Bot $GITHUB_REF_NAME" \
              --notes 'Download ApiTrees.Maui.exe and run it without renaming. .NET and the Windows App SDK are included. Microsoft Edge WebView2 Runtime is required. See the README for LAN certificate setup.'
          fi
